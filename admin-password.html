<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 비밀번호 변경</title>
</head>
  <script>
  (async () => {
    const token = localStorage.getItem("admin_token");
    const time = localStorage.getItem("admin_token_time");

    if (!token || !time) {
      window.location.href = "admin-login.html";
      return;
    }

    const now = Date.now();
    const diff = now - Number(time);
    const SESSION_LIMIT = 2 * 60 * 60 * 1000; // 2시간

    if (diff > SESSION_LIMIT) {
      localStorage.removeItem("admin_token");
      localStorage.removeItem("admin_token_time");
      alert("세션이 만료되었습니다. 다시 로그인해주세요.");
      window.location.href = "admin-login.html";
      return;
    }
  })();
</script>

<body>

<h2>관리자 비밀번호 변경</h2>

<input type="password" id="old" placeholder="현재 비밀번호"><br><br>
<input type="password" id="new1" placeholder="새 비밀번호"><br><br>
<input type="password" id="new2" placeholder="새 비밀번호 확인"><br><br>

<button id="change-btn">비밀번호 변경</button>

<p id="msg"></p>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="admin-password.js"></script>

</body>
</html>
