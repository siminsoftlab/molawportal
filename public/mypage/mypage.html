<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>마이페이지</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="stylesheet" href="/mypage/mypage.css">
  <link rel="icon" href="/images/favicon.ico">
</head>

<body>

  <!-- 🔔 Push 알림 배너 -->
  <div id="pushBanner" class="push-banner" style="display:none;">
    <p>🔔 만료 3일 전 알림을 받으시겠어요?</p>
    <button id="pushAllow">허용</button>
    <button id="pushLater">나중에</button>
  </div>

  <!-- 📱 마이페이지 박스 -->
  <div class="mypage-box">
    <h2>마이페이지</h2>

    <div class="info-box">
      <p><strong>이름:</strong> <span id="mypage-name"></span></p>
      <p><strong>이메일:</strong> <span id="mypage-email"></span></p>
    </div>
    <!-- >🔔 브라우저 푸시 알림 -->
    <h3 class="section-title">🔔 브라우저 푸시 알림</h3>
    <div class="push-setting-box">
      <p id="pushStatus">알림 상태 확인 중...</p>
      <button id="pushSettingBtn" class="mypage-btn">알림 설정하기</button>
    </div>

    <!-- 📅 이용권 상태 -->
    <h3 class="section-title">📅 이용권 상태</h3>
    <div id="mypage-ticket" class="ticket-box">
      이용권 정보를 불러오는 중...
    </div>

    <!-- 🧾 현재 결제 신청 상태 -->
    <h3 class="section-title">🧾 결제 신청 상태</h3>
    <div id="pendingPayment"></div>

    <!-- 버튼 영역 -->
    <button id="buyTicketBtn" class="mypage-btn">이용권 결제 신청</button>
    <button id="paymentHistoryBtn" class="mypage-btn">결제내역조회</button>
    <button id="editInfoBtn" class="mypage-btn">비밀번호 변경</button>
    <button id="homeBtn" class="mypage-btn">홈으로</button>
    <button id="logoutBtn" class="logout-btn">로그아웃</button>
    <button id="deleteAccountBtn" class="logout-btn" style="background:#555;">회원탈퇴</button>
  </div>

  <div class="mypage-home-link">
    <a href="/index.html">홈으로</a>
  </div>

  <!-- ⭐ 푸터 -->
  <div id="footer"></div>
  <a href="http://pf.kakao.com/_wAqxen/chat" class="quick-kakao" target="_blank">💬 카톡 상담</a>
  
  <!-- Firebase 초기화 -->
  <script type="module" src="/firebase-init.js"></script>

  <!-- 마이페이지 기능 -->
  <script type="module" src="/mypage/mypage.js"></script>
  <!-- FCM 알림 설정 -->
  <script type="module" src="/mypage/fcm-mypage.js"></script>
  <script src="/block-right-click.js"></script>
  <script>
  fetch("/footer.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("footer").innerHTML = html;
    });
</script>
</body>
</html>
