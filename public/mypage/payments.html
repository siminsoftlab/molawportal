<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이용권 결제 신청</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/mypage/payments.css">
  <link rel="icon" href="/images/favicon.ico">
</head>

<body>

  <div class="box">
    <h2>이용권 결제 신청</h2>

    <div class="form-group">
      <label>결제방법</label>
      <select id="method">
        <option value="무통장입금">무통장입금</option>
        <option value="카드결제">카드결제</option>
      </select>
    </div>

     <!-- 이용권 선택 -->
    <div class="form-group">
      <label>이용권</label>
      <select id="ticket">
        <option value="1">1개월</option>
        <option value="3">3개월</option>
        <option value="6">6개월</option>
        <option value="12">12개월</option>
        <option value="24">24개월</option>
        <option value="36">36개월</option>
      </select>
    </div>
    
    <!-- 금액 자동 계산 -->
    <div class="form-group">
      <label>금액</label>
      <input id="amount" type="number" readonly>
    </div>
    <!-- 무통장입금 계좌번호 안내 -->
    <div id="bankInfo" class="form-group" style="display:none;">
      <label>입금 계좌번호</label>
      <div class="bank-box">
        <p><strong>은행:</strong> 신한은행</p>
        <p><strong>계좌번호:</strong> 100-032-746773</p>
        <p><strong>예금주:</strong> 법무법인영민</p>
      </div>
    </div>
    <div class="form-group">
      <label>입금자명</label>
      <input id="depositor" type="text" placeholder="입금자명을 입력하세요">
    </div>

    <button id="payBtn" class="submit">결제 신청하기</button>

    <div id="msg" class="msg"></div>

    <button id="backBtn" class="back">← 마이페이지로 돌아가기</button>
  </div>
  <!-- ⭐ 푸터 -->
  <div id="footer"></div>
  <a href="http://pf.kakao.com/_wAqxen/chat" class="quick-kakao" target="_blank">💬 카톡 상담</a>
  <!-- Firebase 초기화 -->
  <script type="module" src="/firebase-init.js"></script>
  <!-- 결제 생성 + 이용권 금액 자동 계산 스크립트 -->
 
  <script type="module" src="/mypage/payments.js"></script>
  <script src="/block-right-click.js"></script>
  <script>
  fetch("/footer.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("footer").innerHTML = html;
    });
</script>
</body>
</html>
