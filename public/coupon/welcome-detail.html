<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>웰컴쿠폰 안내</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f7f8fc;
      padding: 30px 16px;
      color: #333;
    }

    .coupon-box {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 20px;
      text-align: center;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      margin-top: 22px;
      margin-bottom: 10px;
    }

    p {
      line-height: 1.65;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .highlight {
      background: #f0f4ff;
      padding: 14px;
      border-radius: 10px;
      margin-top: 14px;
      border-left: 4px solid #4a6fff;
    }

    .back-btn {
      display: block;
      width: 100%;
      max-width: 200px;
      margin: 30px auto 0;
      padding: 12px;
      text-align: center;
      background: #4a6fff;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
    }

    .back-btn:hover {
      background: #3b57d6;
    }
  </style>
</head>

<body>
  <div class="coupon-box">
    <h2>웰컴쿠폰 7일 무료 이용권</h2>

    <div class="highlight">
      신규 회원가입 시 자동으로 <b>7일 무료 이용권</b>이 발급됩니다.
    </div>

    <div class="section-title">1. 제공 대상</div>
    <p>딱요만큼변제 서비스 신규 가입 회원</p>

    <div class="section-title">2. 제공 혜택</div>
    <p>모든 유료 기능을 7일 동안 무료로 이용할 수 있습니다.</p>

    <div class="section-title">3. 이용 기간</div>
    <p>발급 시점부터 7일간 자동 적용됩니다.</p>

    <div class="section-title">4. 확인 방법</div>
    <p>마이페이지 → 이용권 정보에서 확인 가능합니다.</p>

    <div class="section-title">5. 유의사항</div>
    <p>웰컴쿠폰은 1회만 발급되며, 중복 발급되지 않습니다.</p>

    <a href="/index.html" class="back-btn">홈으로 돌아가기</a>
  </div>
  
</body>
</html>
