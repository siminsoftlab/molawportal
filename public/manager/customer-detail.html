<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, user-scalable=yes">
  <title>고객 상세</title>
  <link rel="stylesheet" href="/manager/manager.css">
  <link rel="stylesheet" href="/manager/customer-detail.css">
</head>

<body>

<header class="header">
  <h1>고객 상세</h1>
  <button onclick="history.back()" class="btn-back">← 뒤로가기</button>
</header>

<section class="detail-box">

  <div class="row">
    <label>고객명</label>
    <div id="name"></div>
  </div>

  <div class="row">
    <label>연락처</label>
    <div id="phone"></div>
  </div>

  <div class="row">
    <label>이메일</label>
    <div id="email"></div>
  </div>

  <div class="row">
    <label>최근 상담일</label>
    <div id="lastConsult"></div>
  </div>

  <div class="row">
    <label>최근 계약</label>
    <div id="lastContract"></div>
  </div>

  <div class="row">
    <label>최근 입금</label>
    <div id="lastPayment"></div>
  </div>

  <div class="row">
    <label>고객 메모</label>
    <textarea id="memo" placeholder="고객 관련 메모를 입력하세요"></textarea>
  </div>

  <button id="saveBtn" class="btn-save">저장하기</button>

  <button class="btn-history" onclick="openHistory()">고객 전체 히스토리 보기</button>

</section>

<script type="module" src="/manager/customer-detail.js"></script>

</body>
</html>
