<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, user-scalable=yes">
  <title>고객 리포트</title>
  <link rel="stylesheet" href="/manager/manager.css">
  <link rel="stylesheet" href="/manager/customer-report.css">  
</head>

<body>

<header class="header">
  <h1>고객 리포트</h1>
  <button onclick="history.back()" class="btn-back">← 뒤로가기</button>
</header>

<section class="customer-info">
  <h2>고객 정보</h2>
  <div class="info-row"><label>이름</label><div id="name"></div></div>
  <div class="info-row"><label>연락처</label><div id="phone"></div></div>
  <div class="info-row"><label>이메일</label><div id="email"></div></div>
</section>

<section class="chart-section">
  <h2>월별 상담 수</h2>
  <canvas id="consultChart"></canvas>
</section>

<section class="chart-section">
  <h2>월별 계약 수</h2>
  <canvas id="contractChart"></canvas>
</section>

<section class="chart-section">
  <h2>월별 입금액</h2>
  <canvas id="paymentChart"></canvas>
</section>

<script type="module" src="/manager/customer-report.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
