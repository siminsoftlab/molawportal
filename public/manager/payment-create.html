<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, user-scalable=yes">
  <title>입금 등록</title>
  <link rel="stylesheet" href="/manager/manager.css">
  <link rel="stylesheet" href="/manager/payment-create.css">
</head>

<body>

<header class="header">
  <h1>입금 등록</h1>
  <button onclick="location.href='/manager/dashboard.html'" class="btn-secondary">대시보드</button>
</header>

<section class="form-box">

  <div class="row">
    <label>고객 선택</label>
    <select id="customerSelect"></select>
  </div>

  <div class="row">
    <label>계약 선택</label>
    <select id="contractSelect"></select>
  </div>

  <div class="row">
    <label>입금 금액</label>
    <input id="amount" type="number" placeholder="예: 500000">
  </div>

  <div class="row">
    <label>입금일</label>
    <input id="paymentDate" type="date">
  </div>

  <div class="row">
    <label>메모</label>
    <textarea id="memo" placeholder="입금 관련 메모를 입력하세요"></textarea>
  </div>

  <button id="saveBtn" class="btn-save">입금 등록</button>

</section>

<script type="module" src="/manager/payment-create.js"></script>

</body>
</html>
