<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>입금 상세</title>

  <link rel="stylesheet" href="/manager/payment-detail.css">
</head>

<body>

<header class="header">
  <h1>입금 상세</h1>
  <button onclick="history.back()" class="btn-back">← 뒤로가기</button>
</header>

<section class="detail-box">

  <div class="row">
    <label>고객명</label>
    <div id="customerName"></div>
  </div>

  <div class="row">
    <label>연락처</label>
    <div id="customerPhone"></div>
  </div>

  <div class="row">
    <label>계약 코드</label>
    <div id="contractCode"></div>
  </div>

  <div class="row">
    <label>입금 금액</label>
    <input id="amount" type="number" placeholder="입금 금액 입력">
  </div>

  <div class="row">
    <label>입금일</label>
    <input id="paymentDate" type="date">
  </div>

  <div class="row">
    <label>상태</label>
    <select id="statusSelect">
      <option value="입금대기">입금대기</option>
      <option value="입금완료">입금완료</option>
      <option value="환불">환불</option>
    </select>
  </div>

  <div class="row">
    <label>메모</label>
    <textarea id="memo" placeholder="입금 관련 메모를 입력하세요"></textarea>
  </div>

  <button id="saveBtn" class="btn-save">저장하기</button>
  <button id="deleteBtn" class="btn-delete">입금 삭제</button>
</section>

<script type="module" src="/manager/payment-detail.js"></script>
<script type="module" src="/manager/payment-delete.js"></script>
</body>
</html>
