<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, user-scalable=yes">
  <title>매니저 성과 대시보드</title>
  <link rel="stylesheet" href="/manager/manager.css">
  <link rel="stylesheet" href="/manager/performance-dashboard.css"> 
</head>

<body>

<header class="header">
  <h1>매니저 성과 대시보드</h1>
  <button onclick="history.back()" class="btn-back">← 뒤로가기</button>
</header>

<section class="manager-info">
  <h2>매니저 정보</h2>
  <div class="info-row"><label>이름</label><div id="managerName"></div></div>
  <div class="info-row"><label>이메일</label><div id="managerEmail"></div></div>
</section>

<section class="summary-cards">
  <div class="card">
    <h3>총 상담</h3>
    <p id="totalConsult">0건</p>
  </div>

  <div class="card">
    <h3>총 계약</h3>
    <p id="totalContract">0건</p>
  </div>

  <div class="card">
    <h3>총 입금액</h3>
    <p id="totalPayment">0원</p>
  </div>
</section>

<section class="chart-section">
  <h2>월별 상담 수</h2>
  <canvas id="consultChart"></canvas>
</section>

<section class="chart-section">
  <h2>월별 계약 수</h2>
  <canvas id="contractChart"></canvas>
</section>

<section class="chart-section">
  <h2>월별 입금액</h2>
  <canvas id="paymentChart"></canvas>
</section>

<script type="module" src="/manager/performance-dashboard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
