<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>개인정보 제3자 제공 동의</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f7f8fc;
      padding: 30px 16px;
      color: #333;
    }

    .terms-box {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 20px;
      text-align: center;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      margin-top: 22px;
      margin-bottom: 10px;
    }

    p {
      line-height: 1.65;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .back-btn {
      display: block;
      width: 100%;
      max-width: 200px;
      margin: 30px auto 0;
      padding: 12px;
      text-align: center;
      background: #4a6fff;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
    }

    .back-btn:hover {
      background: #3b57d6;
    }
  </style>
</head>

<body>
  <div class="terms-box">
    <h2>개인정보 제3자 제공 동의</h2>

    <div class="section-title">1. 제공받는 자</div>
    <p>법무법인 영민 및 서비스 운영 관련 협력 업체</p>

    <div class="section-title">2. 제공 항목</div>
    <p>이름, 연락처, 이메일, 상담 내용, 서비스 이용 정보</p>

    <div class="section-title">3. 제공 목적</div>
    <p>상담 진행, 고객 응대, 서비스 품질 향상, 이용자 문의 처리</p>

    <div class="section-title">4. 보유 및 이용 기간</div>
    <p>제공 목적 달성 후 1년 보관 후 즉시 파기합니다.</p>

    <div class="section-title">5. 동의 거부 권리</div>
    <p>동의를 거부할 수 있으나, 서비스 이용 및 상담 신청이 제한될 수 있습니다.</p>
  </div>
</body>
</html>
