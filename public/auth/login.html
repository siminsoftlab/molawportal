<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="stylesheet" href="/auth/login.css">
  <link rel="icon" href="/images/favicon.ico">
</head>

<body>

<div class="box">
  <h2>로그인</h2>

  <input id="email" type="email" placeholder="이메일">
  <input id="password" type="password" autocomplete="new-password" placeholder="비밀번호">

  <button id="loginBtn">로그인</button>

  <div class="msg" id="msg"></div>

  <p class="link">
    아직 회원이 아니신가요?  
    <a href="/auth/signup.html">회원가입</a>
  </p>
</div>
<div style="text-align:center; margin-top:18px;">
  <a href="/index.html" 
     style="color:#555; font-size:14px; text-decoration:underline; font-weight:600;">
    홈으로
  </a>
</div>
<!-- Firebase -->
<script type="module" src="/firebase-init.js"></script>
<script type="module" src="/firebase-counter.js"></script>

<script type="module" src="/auth/auth-state.js"></script> 
<script src="/auth/login.js"></script>
<script src="/block-right-click.js"></script>

</body>
</html>
