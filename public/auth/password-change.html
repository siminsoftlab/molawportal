<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비밀번호 변경</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="stylesheet" href="/auth/signup.css">
  <link rel="icon" href="/images/favicon.ico">
</head>

<body class="signup-page">

  <div class="box">
    <h2>비밀번호 변경</h2>

    <input id="currentPassword" type="password" placeholder="현재 비밀번호">
    <input id="newPassword" type="password" placeholder="새 비밀번호 (6자 이상)">
    <input id="newPasswordConfirm" type="password" placeholder="새 비밀번호 확인">

    <button id="changePasswordBtn">비밀번호 변경</button>

    <div class="msg" id="msg"></div>
  </div>

  <div class="signup-links">
    <a href="/mypage/mypage.html" class="link">마이페이지</a>
    <span class="divider">|</span>
    <a href="/" class="link">홈으로</a>
  </div>

    <!-- 2) Firebase 초기화 -->
  <script type="module" src="/firebase-init.js"></script>
  <script type="module" src="/auth/auth-state.js"></script>  
  <script type="module" src="/auth/password-change.js"></script>
  <script src="/block-right-click.js"></script>
</body>
</html>
