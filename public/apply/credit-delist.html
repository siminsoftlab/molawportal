    <h2>신청 정보 입력</h2>

      <label>성명</label>
      <input type="text" name="name" required>

      <label>연락처</label>

      <textarea name="content" rows="5" required></textarea>

      <div class="agree-box">
        <input type="checkbox" id="agree" required>
        <label for="agree">개인정보 수집·이용에 동의합니다.</label>
      </div>

      <div class="btn-row">
        <button type="submit">신청하기</button>
      </div>

    </form>
