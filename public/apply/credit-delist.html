<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>채무불이행등재말소 온라인 신청</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/apply/credit-delist.js"></script>
</head>
<body class="subpage">

<header class="fixed-header fixed-top">
  <h1>채무불이행등재말소 신청</h1>
  <a href="/index.html" class="home-btn">홈</a>
</header>

<div class="page-wrap">
  <div class="container">

    <h2>신청 정보 입력</h2>

    <form id="creditDelistForm">

      <label>성명</label>
      <input type="text" name="name" required>

      <label>연락처</label>
      <input type="tel" name="phone" required>

      <label>이메일</label>
      <input type="email" name="email" required>

      <label>주민등록번호(또는 식별번호)</label>
      <input type="text" name="idNumber" required>

      <label>말소 사유</label>
      <input type="text" name="reason" required>

      <label>신청 내용</label>
      <textarea name="content" rows="5" required></textarea>

      <div class="agree-box">
        <input type="checkbox" id="agree" required>
        <label for="agree">개인정보 수집·이용에 동의합니다.</label>
      </div>

      <div class="btn-row">
        <button type="submit">신청하기</button>
      </div>

    </form>

    <p id="submitStatus" style="margin-top:12px; font-size:14px;"></p>

  </div>
</div>

</body>
</html>
