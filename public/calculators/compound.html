    <div class="upload-area">
      <p><b>CSV 붙여넣기</b></p>

      <button onclick="cfParseCSV()">CSV 불러오기</button>
    </div>

    <table id="cfTable" class="cf-table">
      <thead>
        <tr>
          <th>NO</th>
          <th>입금일자</th>
          <th>입금금액</th>
          <th>출금일자</th>
          <th>출금금액</th>
          <th>이용기간(일)</th>
          <th>연이자율(복리)</th>

          <th></th>
