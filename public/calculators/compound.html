<body class="subpage">

<header class="fixed-header fixed-top">
  <h1>복리 연이자율 계산기</h1>
  <a href="/index.html" class="home-btn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">

    </svg>

</header>

<div class="welcome-banner">
  <div class="welcome-center">
    <div class="welcome-text">
      <a href="/coupon/welcome-detail.html">
        🎁 회원가입 즉시 <b>무료 이용권</b> 지급 <span class="detail-link">[자세히]</span>
      </a>
    </div>
  </div>
</div>

<div class="page-wrap">
  <div class="container">
    <h2>📈 복리 연이자율 계산기</h2>  

    <!-- 엑셀 업로드 -->
    <div class="upload-area">
      <p><b>엑셀(.xlsx) 업로드</b></p>
      <input type="file" id="excelFile" accept=".xlsx" onchange="cfReadExcel(event)">
    </div>

    <!-- CSV 붙여넣기 -->
    <div class="upload-area">
      <p><b>CSV 붙여넣기</b></p>
      <textarea id="csvInput" placeholder="NO,입금일자,입금금액,출금일자,출금금액 형식으로 붙여넣기"></textarea>
      <button onclick="cfParseCSV()">CSV 불러오기</button>
    </div>
    <div class="btn-area">
      <label>
        정상 연이자율(%):
        <input type="number" id="annualRate" value="60" step="0.01">
      </label>
      <label>
        지연 연이자율(%):
        <input type="number" id="lateRate" value="20" step="0.01">
      </label>
    </div>
    <div class="btn-area">
      <button onclick="cfAddRow()" class="app-btn-primary">행 추가</button>
      <button onclick="checkAccess(() => cfCalculate())" class="app-btn-primary">연이자율 계산</button>
      <button onclick="cfExportExcel()" class="app-btn-secondary">엑셀 다운로드</button>
      <button onclick="cfExportPDF()" class="app-btn-secondary">PDF 다운로드</button>
    </div>
    <!-- ⭐ NO별 소계 영역 -->
    <div id="subtotalArea" class="subtotal-wrap"></div>

    <table id="cfTable" class="cf-table">
      <thead>
        <tr>
          <th>NO</th>
          <th>입금일자</th>
          <th>입금금액</th>
          <th>출금일자</th>
          <th>출금금액</th>
          <th>이용기간(일)</th>
          <th>연이자율(복리)</th>
        </tr>
      </thead>
      <tbody></tbody>

      <tfoot>
        <tr>
          <th colspan="2">총 합계</th>
          <th id="totalIn">0</th>
          <th></th>
          <th id="totalOut">0</th>
          <th></th>
          <th></th>
        </tr>
      </tfoot>
    </table>
    <!-- 기존 cfTable 바로 아래에 추가 -->
    <h2>📊 결과 테이블</h2>
    
    <div id="resultSubtotalArea" class="subtotal-wrap"></div>
    
    <table id="resultTable" class="cf-table">
    <thead>
      <tr>
        <th>NO</th>
        <th>입금일자</th>
        <th>입금금액</th>
        <th>출금일자</th>
        <th>출금금액</th>
        <th>이용기간(일)</th>
        <th>연이자율(복리)</th>
        <th>상세</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

    <h2>📂 상세내역</h2>
    <div id="detailArea"></div>
  </div>
</div>

<!-- 🔒 이용권 필요 모달 -->

    <button class="app-btn-primary" onclick="location.href='/mypage/payments.html'">
      이용권 결제하기
    </button>

    <button class="app-btn-secondary">
      상담 연결 시 무료 제공
    </button>

    <button class="app-btn-close" onclick="document.getElementById('paywallOverlay').style.display='none'">
      닫기
    </button>
  </div>
