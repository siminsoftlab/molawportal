<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, user-scalable=yes">
  <title>관리자 비밀번호 변경</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f5f6fa;
      font-family: "Pretendard", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 360px;
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    h2 {
      margin-bottom: 24px;
      font-size: 22px;
      font-weight: 700;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #357ac9;
    }

    #msg {
      margin-top: 16px;
      font-size: 14px;
      color: #e74c3c;
      min-height: 20px;
    }

    .back-btn {
      margin-top: 20px;
      display: inline-block;
      font-size: 14px;
      color: #4a90e2;
      cursor: pointer;
    }
  </style>

  <script>
    (async () => {
      const token = localStorage.getItem("admin_token");
      const time = localStorage.getItem("admin_token_time");

      if (!token || !time) {
        window.location.href = "admin-login.html";
        return;
      }

      const now = Date.now();
      const diff = now - Number(time);
      const SESSION_LIMIT = 2 * 60 * 60 * 1000; // 2시간

      if (diff > SESSION_LIMIT) {
        localStorage.removeItem("admin_token");
        localStorage.removeItem("admin_token_time");
        alert("세션이 만료되었습니다. 다시 로그인해주세요.");
        window.location.href = "admin-login.html";
        return;
      }
    })();
  </script>
 <script src="block-right-click.js"></script>  
</head>
<body>

  <div class="container">
    <h2>관리자 비밀번호 변경</h2>

    <input type="password" id="old" placeholder="현재 비밀번호">
    <input type="password" id="new1" placeholder="새 비밀번호">
    <input type="password" id="new2" placeholder="새 비밀번호 확인">

    <button id="change-btn">비밀번호 변경</button>

    <p id="msg"></p>

    <div class="back-btn" onclick="location.href='admin.html'">← 관리자 페이지로 돌아가기</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="admin-password.js"></script>

</body>
</html>
