<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 로그인</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f5f6fa;
      font-family: "Pretendard", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
      color: #333;
    }

    input, button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
      box-sizing: border-box;
      margin-top: 10px;
    }

    button {
      background: #4a90e2;
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #357ac9;
    }

    #login-msg {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

<div class="login-box">
  <h2>관리자 로그인</h2>

  <!-- ⭐ 엔터 입력 시 로그인 실행 -->
  <input type="password" id="pw" placeholder="비밀번호를 입력하세요">

  <button id="login-btn">로그인</button>

  <div id="login-msg"></div>
</div>

<script type="module" src="/firebase-init.js"></script>
<!-- 로그인 스크립트 -->
<script type="module" src="admin-login.js"></script>
<script src="block-right-click.js"></script>
</body>
</html>
