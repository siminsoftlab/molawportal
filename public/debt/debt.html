<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>부채발급대상조회</title>
  <meta name="description" content="부채증명서 발급 대상 전체 채권자 조회">
  <meta name="robots" content="index, follow">

  <link rel="icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="/style.css?v=1006">
  <link rel="stylesheet" href="/debt.css?v=1">
</head>

<body class="subpage">
<header class="fixed-header fixed-top">
  <h1>부채발급대상조회</h1>
  <a href="/index.html" class="home-btn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M3 10L12 3L21 10V21H3V10Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
</header>

<div class="page-wrap">
  <div class="container">

    <div class="card upload-card">
      <h3>📤 스캔파일 업로드 + OCR</h3>
      <input type="file" id="scanFile" accept="image/*,application/pdf">
      <button id="ocrBtn" class="app-btn-primary">OCR로 채권자 추출</button>
      <p id="scanStatus"></p>
    </div>

    <div class="card search-box">
      <input type="text" id="searchInput" placeholder="채권자 검색…">
    </div>

    <div class="card">
      <div class="actions-row">
        <button id="syncBtn" class="app-btn-primary">Firebase + creditors.js 동기화</button>
        <button id="pdfBtn" class="app-btn-secondary">PDF 다운로드</button>
        <button id="excelBtn" class="app-btn-secondary">엑셀 다운로드</button>
      </div>

      <table id="creditorTable">
        <thead>
          <tr>
            <th>채권자</th>
            <th>계좌번호(사건번호)</th>
            <th>등록금액(천원)</th>
            <th>연체금액(천원)</th>
            <th>해제사유</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.1/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<script type="module" src="/firebase-init.js"></script>
<script type="module" src="/debt/debt.js?v=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

</body>
</html>
