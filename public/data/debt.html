      <button id="uploadBtn" class="app-btn-primary">업로드</button>

            <th>등록금액(천원)</th>
            <th>연체금액(천원)</th>
            <th>해제사유</th>
          </tr>
        </thead>
        <tbody>
          <!-- debt.js에서 자동 렌더링 -->
        </tbody>
      </table>

      <button id="saveBtn" class="app-btn-primary" style="margin-top:20px;">
        Firebase에 저장하기
      </button>
    </div>
    <!-- ⭐⭐ 테이블 끝 ⭐⭐ -->
