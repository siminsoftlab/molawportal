<body class="homepage">

<!-- ⭐ header -->
<div id="header"></div>
<script>

    .then(r => r.text())

</script>

<!-- ⭐ breadcrumb (header 바로 아래) -->
<nav class="bbs-breadcrumb">

</nav>

<!-- ⭐ 2단 레이아웃 -->
<div class="layout-2col">

  <!-- 중앙 콘텐츠 -->
  <main class="center-content">

    <h2>게시판</h2>

    <!-- ⭐ 앱 스타일 select -->
    <select id="categoryFilter" class="bbs-select">
      <option value="">전체</option>
      <option value="notice">공지사항</option>
      <option value="news">뉴스</option>
      <option value="event">이벤트</option>
      <option value="resource">자료실</option>
      <option value="case">판례</option>
    </select>

    <!-- ⭐ 게시판 목록 -->
    <table id="postTable" class="bbs-table">
      <thead>
        <tr>
          <th>번호</th>
          <th>제목</th>
          <th>카테고리</th>
          <th>작성일</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- ⭐ 글쓰기 버튼 (footer 바로 위) -->

      <a href="/bbs/board-write.html" class="app-btn-primary">글쓰기</a>

  <!-- ⭐ 우측 사이드바 -->

</div>

<!-- ⭐ footer -->
<div id="footer"></div>
<script>
  fetch("/footer-ch.html")
    .then(r => r.text())
    .then(html => {
      document.getElementById("footer").innerHTML = html;
    });
</script>

<!-- ⭐ modals -->
<div id="modals"></div>
<script type="module">
  import { initApplyModal } from "/common-apply-ch.js";

  fetch("/modals.html")
    .then(r => r.text())
    .then(html => {
      document.getElementById("modals").innerHTML = html;
      initApplyModal();
    });
</script>

<!-- ⭐ side.html -->
<script type="module">
  import { syncVisitorUI } from "/firebase-counter.js";

  fetch("/side.html")
    .then(r => r.text())
    .then(async html => {
      document.getElementById("side").innerHTML = html;

      const { initAuthStateSidebar } = await import("/auth/auth-state-ch.js");
      initAuthStateSidebar();

      const { initSidebarLogin } = await import("/auth/login-ch.js");
      initSidebarLogin();

      // ⭐ 방문자수 즉시 동기화
      setTimeout(syncVisitorUI, 300);
    });
</script>

<!-- ⭐ 게시판 로직 -->
<script type="module">
  import { loadPostList, filterByCategory, getCategoryName } from "/bbs/board.js";

  async function renderBoard() {
    const posts = await loadPostList();
    const tbody = document.querySelector("#postTable tbody");

    const params = new URLSearchParams(location.search);
    const catParam = params.get("cat");

    const category = catParam || document.getElementById("categoryFilter").value;

    // breadcrumb 표시
    document.getElementById("bbs-current-category").textContent =
      getCategoryName(category);

    const filtered = filterByCategory(posts, category);

    tbody.innerHTML = "";

    filtered.forEach(p => {
      const date = new Date(p.createdAt.seconds * 1000).toLocaleDateString();

      tbody.innerHTML += `
        <tr onclick="location.href='/bbs/board-view.html?id=${p.id}'">
          <td>${p.postId}</td>
          <td>${p.title}</td>
          <td>${getCategoryName(p.category)}</td>
          <td>${date}</td>
        </tr>
      `;
    });
  }

  document.getElementById("categoryFilter").onchange = renderBoard;

  renderBoard();
</script>

<script type="module" src="/firebase-init.js"></script>
<script src="/premium-optimized.js?v=2"></script>
<script src="/block-right-click.js"></script>

</body>
