<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상담 상세 정보</title>

  <link rel="stylesheet" href="/admin.css?v=1004">
  <link rel="stylesheet" href="/admin/admin-users.css?v=1001">
  <link rel="stylesheet" href="/admin/consult-detail.css">
</head>

<body>

<!-- 상단 헤더 -->
<div class="admin-header">
  <div class="title">📄 상담 상세 정보</div>
  <div class="actions">
    <button onclick="location.href='/admin/admin-consult.html'" class="btn-secondary">목록으로</button>
    <button id="logout-btn" class="btn-danger">로그아웃</button>
  </div>
</div>

<div class="page-wrapper">

  <!-- 상담 기본 정보 -->
  <div class="admin-container section">
    <div class="card">
      <div class="card-title">상담 정보</div>

      <table class="detail-table">
        <tr><th>이름</th><td id="name"></td></tr>
        <tr><th>연락처</th><td id="phone"></td></tr>
        <tr><th>이메일</th><td id="email"></td></tr>
        <tr><th>상담 유형</th><td id="type"></td></tr>
        <tr><th>상담 내용</th><td id="message" style="white-space:pre-line;"></td></tr>
        <tr><th>신청일</th><td id="createdAt"></td></tr>
      </table>
    </div>
  </div>

  <!-- 관리 항목 -->
  <div class="admin-container section">
    <div class="card">
      <div class="card-title">관리 항목</div>

      <table class="detail-table">
        <tr>
          <th>진행상태</th>
          <td>
            <select id="status">
              <option value="신청">신청</option>
              <option value="접수">접수</option>
              <option value="배정">배정</option>
              <option value="진행중">진행중</option>
              <option value="완료">완료</option>
              <option value="보류">보류</option>
              <option value="취소">취소</option>
            </select>
          </td>
        </tr>

        <tr><th>담당자</th><td><input type="text" id="manager"></td></tr>
        <tr><th>파트너</th><td><input type="text" id="partner"></td></tr>
        <tr><th>계약서 코드</th><td><input type="text" id="contractCode"></td></tr>
      </table>

      <button id="saveBtn" class="btn-primary" style="margin-top:20px;">저장하기</button>
    </div>
  </div>

  <!-- 진행상황 -->
  <div class="admin-container section">
    <div class="card">
      <div class="card-title">진행상황</div>

      <textarea id="progressMemo" placeholder="진행 메모 입력" style="width:100%; height:80px;"></textarea>
      <button id="addProgressBtn" class="btn-primary" style="margin-top:10px;">진행상황 추가</button>

      <ul id="progressList" style="margin-top:15px;"></ul>
    </div>
  </div>

  <!-- 계약서 업로드 -->
  <div class="admin-container section">
    <div class="card">
      <div class="card-title">계약서</div>

      <input type="file" id="contractFile">
      <button id="uploadContractBtn" class="btn-primary" style="margin-top:10px;">계약서 업로드</button>

      <div id="contractInfo" style="margin-top:15px;"></div>
    </div>
  </div>

  <!-- 입금/분납 관리 -->
  <div class="admin-container section">
    <div class="card">
      <div class="card-title">입금 / 분납 관리</div>

      <label>총 금액</label>
      <input type="number" id="totalAmount" style="width:200px;">

      <label style="margin-left:20px;">입금된 금액</label>
      <input type="number" id="paidAmount" style="width:200px;">

      <table id="paymentTable" class="detail-table" style="margin-top:20px;">
        <thead>
          <tr>
            <th>기한</th>
            <th>금액</th>
            <th>입금 여부</th>
          </tr>
        </thead>
        <tbody id="paymentBody"></tbody>
      </table>

      <button id="addPaymentRowBtn" class="btn-secondary" style="margin-top:10px;">분납 회차 추가</button>
      <button id="savePaymentsBtn" class="btn-primary" style="margin-top:10px;">입금 정보 저장</button>
    </div>
  </div>

</div>

<script type="module" src="/firebase-init.js"></script>
<script type="module" src="/admin/consult-detail.js"></script>

</body>
</html>
