<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상담 상세 정보</title>

  <link rel="stylesheet" href="/admin.css?v=1004">
  <link rel="stylesheet" href="/admin/admin-users.css?v=1001">
  <link rel="stylesheet" href="/admin/consult-detail.css">
</head>

<body>

<div class="page-wrapper">

  <!-- 상단 헤더 -->
  <div class="admin-header">
    <div class="title">📄 상담 상세 정보</div>
    <div class="actions">
      <button onclick="location.href='/admin/admin-consult.html'" class="btn-secondary">목록으로</button>
      <button id="logout-btn" class="btn-danger">로그아웃</button>
    </div>
  </div>

  <!-- 상세 정보 카드 -->
  <div class="admin-container section">
    <div class="card">
      <div class="card-title">상담 정보</div>

      <table class="detail-table">
        <tr>
          <th>이름</th>
          <td id="name"></td>
        </tr>
        <tr>
          <th>연락처</th>
          <td id="phone"></td>
        </tr>
        <tr>
          <th>이메일</th>
          <td id="email"></td>
        </tr>
        <tr>
          <th>상담 유형</th>
          <td id="type"></td>
        </tr>
        <tr>
          <th>상담 내용</th>
          <td id="message" style="white-space:pre-line;"></td>
        </tr>
        <tr>
          <th>신청일</th>
          <td id="createdAt"></td>
        </tr>
      </table>
    </div>
  </div>

  <!-- 관리 항목 -->
  <div class="admin-container section">
    <div class="card">
      <div class="card-title">관리 항목</div>

      <table class="detail-table">
        <tr>
          <th>진행상태</th>
          <td>
            <select id="status">
              <option value="신규">신규</option>
              <option value="상담중">상담중</option>
              <option value="완료">완료</option>
              <option value="보류">보류</option>
              <option value="취소">취소</option>
            </select>
          </td>
        </tr>

        <tr>
          <th>담당자</th>
          <td><input type="text" id="manager" placeholder="담당자 이름"></td>
        </tr>

        <tr>
          <th>파트너</th>
          <td><input type="text" id="partner" placeholder="파트너 이름"></td>
        </tr>

        <tr>
          <th>계약서 코드</th>
          <td><input type="text" id="contractCode" placeholder="계약서 코드"></td>
        </tr>
      </table>

      <button id="saveBtn" class="btn-primary" style="margin-top:20px;">저장하기</button>
    </div>
  </div>

</div>

<script type="module" src="/firebase-init.js"></script>
<script type="module" src="/admin/consult-detail.js"></script>

</body>
</html>
