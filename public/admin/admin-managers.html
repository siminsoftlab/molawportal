<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>담당자 관리</title>
  <link rel="stylesheet" href="/admin.css">

  <style>
    .manager-actions {
      display: flex;
      gap: 8px;
    }
    .manager-actions button {
      padding: 6px 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="admin-header">
  <div class="title">👤 담당자 관리</div>
  <div class="actions">
    <button onclick="location.href='/admin.html'" class="btn-secondary">대시보드</button>
    <button id="logout-btn" class="btn-danger">로그아웃</button>
  </div>
</div>

<div class="page-wrapper">

  <!-- 담당자 등록 -->
  <div class="admin-container section">
    <div class="card">
      <div class="card-title">담당자 등록</div>

      <!-- 이름 검색 -->
      <label>회원 이름 검색</label>
      <div style="display:flex; gap:10px;">
        <input id="searchName" type="text" placeholder="회원 이름 입력">
        <button id="searchUserBtn" class="btn-secondary">검색</button>
      </div>

      <!-- 검색 결과 테이블 -->
      <div id="searchResults" style="margin-top:15px;"></div>

      <label style="margin-top:15px;">담당자 UID</label>
      <input id="managerUid" type="text" placeholder="Firebase Auth UID">

      <label>담당자 이름</label>
      <input id="managerName" type="text" placeholder="홍길동">

      <label>담당자 이메일</label>
      <input id="managerEmail" type="email" placeholder="manager@example.com">

      <button id="saveManagerBtn" class="btn-primary" style="margin-top:15px;">
        담당자 등록
      </button>
    </div>
  </div>

  <!-- 담당자 목록 -->
  <div class="admin-container section">
    <div class="card">
      <div class="card-title">등록된 담당자 목록</div>

      <table class="admin-table">
        <thead>
          <tr>
            <th>UID</th>
            <th>이름</th>
            <th>이메일</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="managerTableBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script type="module" src="/firebase-init.js"></script>
<script type="module" src="/admin/admin-managers.js"></script>

</body>
</html>
