<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, user-scalable=yes">
  <title>상담 신청 목록</title>

  <link rel="stylesheet" href="/admin.css?v=1004">
  <link rel="stylesheet" href="/admin/admin-users.css?v=1001">
  <style>
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal-content {
  background: white;
  padding: 20px;
  width: 350px;
  border-radius: 8px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.modal-buttons {
  margin-top: 20px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}
</style>

</head>

<body>
<!-- 상단 헤더 -->
  <div class="admin-header">
    <div class="title">📞 상담 신청 목록</div>
    <div class="actions">
      <button onclick="location.href='/admin.html'" class="btn-secondary">대시보드</button>
      <button id="logout-btn" class="btn-danger">로그아웃</button>
    </div>
  </div>
<div class="page-wrapper"> 

  <!-- 검색 박스 -->
  <div class="admin-container section">
    <div class="card search-card">
      <div class="card-title">상담 검색</div>
      <input id="searchInput" type="text" placeholder="이름, 연락처, 이메일, 유형 검색" style="width:100%;">
    </div>
  </div>

  <!-- 상담 목록 -->
  <div class="admin-container section">
    <div class="card table-wrapper">
      <div class="card-title">상담 신청 목록</div>

      <table class="admin-table">
        <thead>
          <tr>
            <th>이름</th>
            <th>연락처</th>          
            <th>유형</th>           
            <th>신청일</th>
            <th>진행상태</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="consultTableBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script type="module" src="/firebase-init.js"></script>
<script type="module" src="/admin/admin-consult.js"></script>
<!-- 담당자 선택 모달 -->
<div id="managerModal" class="modal">
  <div class="modal-content">
    <h3>담당자 배정</h3>

    <label>담당자 선택</label>
    <select id="managerSelect" style="width:100%; padding:8px; margin-top:10px;"></select>

    <div class="modal-buttons">
      <button id="assignConfirm" class="btn-primary">배정하기</button>
      <button id="assignCancel" class="btn-secondary">취소</button>
    </div>
  </div>
</div>

</body>
</html>
