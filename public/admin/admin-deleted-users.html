<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>탈퇴 회원 조회</title>
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="/admin/admin-deleted-users.css">
</head>
<body>
<!-- 상단 헤더 -->
  <div class="admin-header">
    <div class="title">탈퇴 회원 조</div>
    <div class="actions">
      <button onclick="location.href='/admin.html'" class="btn-secondary">대시보드</button>
      <button id="logout-btn" class="btn-danger">로그아웃</button>
    </div>
  </div>

  <table id="deletedTable">
    <thead>
      <tr>
        <th>UID</th>
        <th>이름</th>
        <th>이메일</th>
        <th>탈퇴일</th>
        <th>결제내역</th>
        <th>이용권</th>
        <th>쿠폰</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <p id="emptyMsg" class="empty" style="display:none;">탈퇴한 회원이 없습니다.</p>

  <script type="module" src="/admin/admin-deleted-users.js"></script>
</body>
</html>
