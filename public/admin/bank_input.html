<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>은행 입금내역 입력</title>

  <link rel="stylesheet" href="bank_input.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>

<body>

<div class="box">
  <h2>🏦 은행 입금내역 입력</h2>

  <div class="form">
    <label>입금자명</label>
    <input type="text" id="depositor" placeholder="예: 홍길동">

    <label>입금 금액</label>
    <input type="number" id="amount" placeholder="예: 30000">

    <label>입금 시간</label>
    <input type="datetime-local" id="depositTime">

    <button id="submitBtn" class="submit">입금내역 등록</button>
    <button id="backBtn" class="back">← 관리자 홈으로</button>
  </div>
</div>

<script src="bank_input.js"></script>
</body>
</html>
