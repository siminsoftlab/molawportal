<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 결제 관리</title>
  <link rel="stylesheet" href="/admin.css"> 
  <link rel="stylesheet" href="/admin/payments.css"> 
</head>

<body>
 <!-- 상단 헤더 -->
  <div class="admin-header">
    <div class="title">💰 결제 관리 대시보드</div>

    <div class="actions">
      <button onclick="location.href='/admin.html'" class="btn-secondary">대시보드</button>
      <button id="logout-btn" class="btn-danger">로그아웃</button>
    </div>
  </div>
<div class="box">
  <input 
  type="text" 
  id="searchInput" 
  class="search" 
  placeholder="입금자명 검색 (예: 홍길동)">
</div>
<div class="box">
  <div id="paymentList" class="payment-list">
    <p>결제내역을 불러오는 중...</p>
  </div>
  <button id="excelBtn" class="excel">📥 엑셀 다운로드</button> 
</div>
  <!-- Firebase 초기화 -->
  <script type="module" src="/firebase-init.js"></script>
  <script type="module" src="/admin/payments.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>   
  <script>
    (async () => {
      const token = localStorage.getItem("admin_token");
      const time = localStorage.getItem("admin_token_time");

      if (!token || !time) {
        window.location.href = "admin-login.html";
        return;
      }

      const now = Date.now();
      const diff = now - Number(time);
      const SESSION_LIMIT = 2 * 60 * 60 * 1000; // 2시간

      if (diff > SESSION_LIMIT) {
        localStorage.removeItem("admin_token");
        localStorage.removeItem("admin_token_time");
        alert("세션이 만료되었습니다. 다시 로그인해주세요.");
        window.location.href = "/admin-login.html";
        return;
      }
    })();
  </script>
</body>
</html>
