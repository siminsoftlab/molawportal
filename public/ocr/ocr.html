<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>채권사별 채권현황 정리</title>
  <link rel="stylesheet" href="ocr.css" />
</head>
<body>
  <div class="container">
    <h1>채권사별 채권현황 정리</h1>

    <div class="upload-section">
      <label for="pdfFile">PDF 파일 업로드:</label>
      <input type="file" id="pdfFile" accept="application/pdf" />
      <button id="parseBtn">텍스트 추출 및 분석</button>
    </div>

    <div id="status" class="status">PDF 파일을 선택한 후 버튼을 눌러주세요.</div>

    <div class="table-section">
      <h2>채권사별 채권현황</h2>
      <table id="debtTable">
        <thead>
          <tr>
            <th>채권사</th>
            <th>채권사 전화번호</th>
            <th>계좌번호/사건번호</th>
            <th>대출종류</th>          <!-- 이 줄 추가 -->
            <th>양도/양수 이력</th>
            <th>채무변제 여부</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="flowContainer"></div>

    <div class="export-section">
      <button id="exportExcelBtn">엑셀(xlsx)로 내보내기</button>
    </div>
  </div>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js"></script>

  <!-- SheetJS (xlsx) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- OpenCV.js (★ 필수) -->
  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
  
  <!-- 페이지 렌더링 → Tesseract.js로 OCR → 텍스트 추출 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <script src="ocr.js?v=20240711"></script>
</body>
</html>
