<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>채권사 추출 및 저장</title>
</head>
<body>
  <h1>채권사 정보 추출 및 저장</h1>

  <input type="file" id="pdfFile" accept="application/pdf" />
  <button id="parseBtn">PDF 분석</button>
  <p id="status">대기 중...</p>

  <table id="creditorTable" border="1">
    <thead>
      <tr>
        <th>채권사명</th>
        <th>계좌번호</th>
        <th>대출종류</th>
        <th>양도/양수 이력</th>
        <th>채무변제여부</th>
        <th>alive (true/false)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <button id="saveToFirestoreBtn">Firestore에 채권사 저장</button>

  <!-- pdf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- XLSX (엑셀 내보내기 필요하면 유지) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Firebase 초기화 (v9) -->
  <script type="module" src="./firebase-init.js"></script>
  <!-- 채권사 추출/저장 JS -->
  <script type="module" src="./creditor-companies.js"></script>
</body>
</html>
