<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이용권 결제 신청</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="stylesheet" href="payments.css">
  <link rel="icon" href="../images/favicon.ico">
</head>

<body>

  <div class="box">
    <h2>이용권 결제 신청</h2>

    <!-- 이용권 선택 -->
    <div class="form-group">
      <label>이용권</label>
      <select id="ticket">
        <option value="1">1개월</option>
        <option value="3">3개월</option>
        <option value="6">6개월</option>
        <option value="12">12개월</option>
        <option value="24">24개월</option>
        <option value="36">36개월</option>
      </select>
    </div>

    <div class="form-group">
      <label>결제방법</label>
      <select id="method">
        <option value="무통장입금">무통장입금</option>
        <option value="카드결제">카드결제</option>
      </select>
    </div>

    <!-- 금액 자동 계산 -->
    <div class="form-group">
      <label>금액</label>
      <input id="amount" type="number" readonly>
    </div>

    <div class="form-group">
      <label>입금자명</label>
      <input id="depositor" type="text" placeholder="입금자명을 입력하세요">
    </div>

    <button id="payBtn" class="submit">결제 신청하기</button>

    <div id="msg" class="msg"></div>

    <button id="backBtn" class="back">← 마이페이지로 돌아가기</button>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- Firebase 초기화 -->
  <script src="/firebase-init.js"></script>

  <!-- 결제 생성 + 이용권 금액 자동 계산 스크립트 -->
  <script>
    /* ============================
       할인율 포함 금액 계산 함수
    ============================ */
    function calculatePrice(months) {
      const base = months * 30000; // 기본가
      let discount = 0;

      if (months === 3) discount = 0.10;      // 10%
      else if (months === 6) discount = 0.15; // 15%
      else if (months === 12) discount = 0.30; // 30%
      else if (months === 24) discount = 0.40; // 40%
      else if (months === 36) discount = 0.50; // 50%

      return Math.round(base * (1 - discount));
    }

    /* ============================
       이용권 선택 시 금액 자동 입력
    ============================ */
    const ticketSelect = document.getElementById("ticket");
    const amountInput = document.getElementById("amount");

    function updateAmount() {
      const months = Number(ticketSelect.value);
      const price = calculatePrice(months);
      amountInput.value = price;
    }

    // 페이지 로드 시 기본 금액 설정
    updateAmount();

    // 이용권 변경 시 자동 업데이트
    ticketSelect.addEventListener("change", updateAmount);

    /* ============================
       결제 생성
    ============================ */
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        alert("로그인이 필요합니다.");
        window.location.href = "/auth/login.html";
        return;
      }

      document.getElementById("payBtn").onclick = async () => {
        const method = document.getElementById("method").value;
        const amount = Number(amountInput.value);
        const depositor = document.getElementById("depositor").value.trim();
        const msg = document.getElementById("msg");

        if (!depositor) {
          msg.textContent = "입금자명을 입력해주세요.";
          return;
        }

        try {
          await db.collection("payments").add({
            user_id: user.uid,
            method,
            amount,
            depositor_name: depositor,
            status: "pending",
            created_at: Date.now(),
            confirmed_at: null
          });

          msg.textContent = "결제 신청이 완료되었습니다. 관리자 확인 후 이용권이 활성화됩니다.";

        } catch (e) {
          msg.textContent = "오류: " + e.message;
        }
      };
    });

    /* ============================
       뒤로가기
    ============================ */
    document.getElementById("backBtn").onclick = () => {
      window.location.href = "/mypage/mypage.html";
    };
  </script>

</body>
</html>
