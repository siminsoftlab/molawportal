<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입</title>

  <link rel="stylesheet" href="signup.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>

<body class="signup-page">

<!-- ⭐ 상단 네비게이션 -->
<div class="signup-header">
  <a href="/" class="nav-btn">홈으로</a>
  <a href="/auth/login.html" class="nav-btn">로그인</a>
</div>

<!-- ⭐ 회원가입 박스 -->
<div class="box">
  <h2>회원가입</h2>

  <input id="name" type="text" placeholder="이름">
  <input id="email" type="email" placeholder="이메일">
  <input id="password" type="password" autocomplete="new-password" placeholder="비밀번호 (6자 이상)">
  <input type="password" id="signup-password-confirm" autocomplete="new-password" placeholder="비밀번호 확인">

  <button id="signupBtn">회원가입</button>

  <div class="msg" id="msg"></div>
</div>

<script src="signup.js"></script>
</body>
</html>
