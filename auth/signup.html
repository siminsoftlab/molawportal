<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="stylesheet" href="signup.css">  
  <link rel="icon" href="../images/favicon.ico">
  
</head>

<body class="signup-page">  
  <!-- ⭐ 회원가입 박스 -->
  <div class="box">
    <h2>회원가입</h2>
  
    <input id="name" type="text" placeholder="이름">
    <input id="email" type="email" placeholder="이메일">
    <input id="password" type="password" autocomplete="new-password" placeholder="비밀번호 (6자 이상)">
    <input type="password" id="signup-password-confirm" autocomplete="new-password" placeholder="비밀번호 확인">
     <!-- ⭐ 이용약관 + 개인정보 제3자 제공 동의 -->
    <div class="agree-wrap">
      <label class="agree-item">
        <input type="checkbox" id="agreeTerms">
        <span>이용약관에 동의합니다.</span>
        <a href="/policy/terms.html" target="_blank" class="agree-link">[보기]</a>
      </label>

      <label class="agree-item">
        <input type="checkbox" id="agreePrivacy">
        <span>개인정보 제3자 제공에 동의합니다.</span>
        <a href="/policy/privacy-third.html" target="_blank" class="agree-link">[보기]</a>
      </label>
    </div>
    <button id="signupBtn">회원가입</button>
  
    <div class="msg" id="msg"></div>
  </div>
  <div class="signup-links">
  <a href="/" class="link">홈으로</a>
  <span class="divider">|</span>
  <a href="/auth/login.html" class="link">로그인</a>
</div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

</html>
