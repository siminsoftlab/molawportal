<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 로그인</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f5f6fa;
      font-family: "Pretendard", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 360px;
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    h2 {
      margin-bottom: 24px;
      font-size: 22px;
      font-weight: 700;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #357ac9;
    }

    #msg {
      margin-top: 16px;
      font-size: 14px;
      color: #e74c3c;
      min-height: 20px;
    }
  </style>

</head>
<body>

  <div class="container">
    <h2>관리자 로그인</h2>

    <input type="password" id="pw" placeholder="관리자 비밀번호 입력">

    <button id="login-btn">로그인</button>

    <p id="msg"></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="admin-login.js"></script>

</body>
</html>
