<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 페이지</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f5f6fa;
      font-family: "Pretendard", sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 30px 20px;
    }

    h2 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
      color: #333;
    }

    .card {
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #333;
    }

    .value-box {
      font-size: 32px;
      font-weight: 700;
      color: #4a90e2;
      text-align: center;
      margin-top: 10px;
    }

    input, button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      background: #4a90e2;
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background: #357ac9;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
      box-sizing: border-box;
      resize: none;
      background: #fafafa;
    }

    canvas {
      width: 100% !important;
      max-height: 260px;
    }

    .top-buttons {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .top-buttons button {
      width: 48%;
    }
  </style>

  <script>
    (async () => {
      const token = localStorage.getItem("admin_token");
      const time = localStorage.getItem("admin_token_time");

      if (!token || !time) {
        window.location.href = "admin-login.html";
        return;
      }

      const now = Date.now();
      const diff = now - Number(time);
      const SESSION_LIMIT = 2 * 60 * 60 * 1000;

      if (diff > SESSION_LIMIT) {
        localStorage.removeItem("admin_token");
        localStorage.removeItem("admin_token_time");
        alert("세션이 만료되었습니다. 다시 로그인해주세요.");
        window.location.href = "admin-login.html";
        return;
      }
    })();
  </script>

</head>
<body>

<div class="container">

  <h2>관리자 페이지</h2>

  <div class="top-buttons">
    <button onclick="location.href='admin-password.html'">비밀번호 변경</button>
    <button onclick="logout()">로그아웃</button>
  </div>

  <!-- 오늘 방문자 -->
  <div class="card">
    <div class="card-title">오늘 방문자</div>
    <div id="admin-today" class="value-box">0</div>
  </div>

  <!-- 전체 방문자 -->
  <div class="card">
    <div class="card-title">전체 방문자</div>
    <div id="admin-total" class="value-box">0</div>
  </div>

  <!-- 시간대별 그래프 -->
  <div class="card">
    <div class="card-title">시간대별 방문자 그래프</div>
    <canvas id="hourChart"></canvas>
  </div>

  <!-- 브라우저 통계 -->
  <div class="card">
    <div class="card-title">브라우저 통계</div>
    <canvas id="browserChart"></canvas>
  </div>

  <!-- OS 통계 -->
  <div class="card">
    <div class="card-title">OS 통계</div>
    <canvas id="osChart"></canvas>
  </div>

  <!-- Daily 조회 -->
  <div class="card">
    <div class="card-title">Daily 방문자 조회</div>
    <input type="date" id="daily-date">
    <button id="daily-btn">조회</button>
    <textarea id="daily-log" readonly></textarea>
  </div>

  <!-- IP 상세 정보 -->
  <div class="card">
    <div class="card-title">IP 상세 정보</div>
    <textarea id="ip-detail-log" readonly></textarea>
  </div>

  <!-- 샤드 상태 -->
  <div class="card">
    <div class="card-title">샤드 상태</div>
    <textarea id="shard-list" readonly></textarea>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="admin.js"></script>

<script>
function logout() {
  localStorage.removeItem("admin_token");
  localStorage.removeItem("admin_token_time");
  window.location.href = "admin-login.html";
}
</script>

</body>
</html>
