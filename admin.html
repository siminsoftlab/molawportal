<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 방문자 모니터링</title>

  <link rel="stylesheet" href="admin.css?v=1003">
</head>

<body>

  <!-- 상단 헤더 -->
  <div class="admin-header">
    <div class="title">📊 관리자 대시보드</div>

    <div class="actions">
      <button id="change-pw-btn" class="btn-secondary">비밀번호 변경</button>
      <button id="logout-btn" class="btn-danger">로그아웃</button>
    </div>
  </div>

  <!-- 1 방문자 카드 -->
  <div class="admin-container section">
    <div class="card">
      <div class="card-title">오늘 방문자</div>
      <div id="visitor-today" class="card-value">0</div>
    </div>

    <div class="card">
      <div class="card-title">전체 방문자</div>
      <div id="visitor-total" class="card-value">0</div>
    </div>
  </div>

  <!-- 2 결제 / 이용권 관리 -->
<div class="admin-container section">

  <!-- 결제 신청 (pending) 개수 -->
  <div class="card">
    <div class="card-title">🧾 결제 신청 (PENDING)</div>
    <div id="payment-pending-count" class="card-value">0</div>
    <button id="payment-manage-btn" class="btn-secondary" style="margin-top:10px;">
      결제 신청 목록 보기
    </button>
  </div>

  <!-- 활성 이용권 개수 -->
  <div class="card">
    <div class="card-title">🎟 활성 이용권 수</div>
    <div id="token-active-count" class="card-value">0</div>
    <button id="token-manage-btn" class="btn-secondary" style="margin-top:10px;">
      이용권 관리 페이지
    </button>
  </div>

  <!-- 오늘 발급된 이용권 수 -->
  <div class="card">
    <div class="card-title">📅 오늘 발급된 이용권</div>
    <div id="token-today-count" class="card-value">0</div>
  </div>

</div>

  <!-- 3 브라우저 / OS 통계 -->
  <div class="admin-container section">
    <div class="card">
      <div class="card-title">🌐 브라우저 통계</div>
      <canvas id="browserChart" height="120"></canvas>
    </div>

    <div class="card">
      <div class="card-title">💻 OS 통계</div>
      <canvas id="osChart" height="120"></canvas>
    </div>
  </div>

  <!-- 4 샤드 / Daily / IP 상세정보 (3개 한 줄) -->
<div class="admin-container section"> 

  <!-- Daily 방문자 로그 -->
  <div class="card">
    <div class="card-title">📅 Daily 방문자 로그</div>

    <div class="daily-controls">
      <input type="date" id="daily-date">
      <button id="daily-btn" class="btn-secondary">조회</button>
    </div>

    <pre id="daily-log">날짜를 선택하세요.</pre>
    <div id="daily-buttons" style="margin-top:10px; display:flex; gap:10px;"></div>
  </div>

  <!-- 방문자 상세 정보 -->
  <div class="card">
    <div class="card-title">📌 방문자 상세 정보 (IP / 국가 / 도시 / 접속시간)</div>

    <pre id="ip-detail-log">날짜를 선택하면 표시됩니다.</pre>
    <div id="ip-buttons" style="margin-top:10px; display:flex; gap:10px;"></div>
  </div>

   <!-- 샤드 상태 -->
  <div class="card">
    <div class="card-title">🧩 샤드 상태</div>
    <pre id="shard-list" class="shard-table"></pre>
    <div id="shard-buttons" style="margin-top:10px; display:flex; gap:10px;"></div>
  </div>
</div>

  <!-- 로그인 체크 -->
  <script>
    (async () => {
      const token = localStorage.getItem("admin_token");
      const time = localStorage.getItem("admin_token_time");

      if (!token || !time) {
        window.location.href = "admin-login.html";
        return;
      }

      const now = Date.now();
      const diff = now - Number(time);
      const SESSION_LIMIT = 2 * 60 * 60 * 1000; // 2시간

      if (diff > SESSION_LIMIT) {
        localStorage.removeItem("admin_token");
        localStorage.removeItem("admin_token_time");
        alert("세션이 만료되었습니다. 다시 로그인해주세요.");
        window.location.href = "admin-login.html";
        return;
      }
    })();
  </script>

 
    <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- Firebase 초기화 -->
  <script src="/firebase-init.js"></script>
  <script src="firebase-counter.js" defer></script>
   <!-- admin.js -->
  <script src="admin.js?v=1003" defer></script>
    <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="block-right-click.js"></script>

</body>
</html>
