<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 방문자 모니터링</title>

  <link rel="stylesheet" href="admin.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
  // 🔐 관리자 로그인 체크
  (async () => {
    const token = localStorage.getItem("admin_token");
    if (!token) {
      // 로그인 안 되어 있으면 로그인 페이지로 이동
      window.location.href = "admin-login.html";
    }
  })();
</script>
  <script>
  (async () => {
    const token = localStorage.getItem("admin_token");
    const time = localStorage.getItem("admin_token_time");

    if (!token || !time) {
      window.location.href = "admin-login.html";
      return;
    }

    const now = Date.now();
    const diff = now - Number(time);

    const SESSION_LIMIT = 2 * 60 * 60 * 1000; // 2시간

    if (diff > SESSION_LIMIT) {
      localStorage.removeItem("admin_token");
      localStorage.removeItem("admin_token_time");
      alert("세션이 만료되었습니다. 다시 로그인해주세요.");
      window.location.href = "admin-login.html";
      return;
    }
  })();
</script>
</head>
<body>

  <header>
    <h1>📊 방문자 분석 관리자 페이지</h1>
  </header>
  <button id="logout-btn" style="float:right;">로그아웃</button>
  <!-- 대시보드 카드 -->
  <div class="dashboard">
    <div class="card">
      <h3>오늘 방문자</h3>
      <div id="admin-today" class="big-number">0</div>
    </div>

    <div class="card">
      <h3>전체 방문자</h3>
      <div id="admin-total" class="big-number">0</div>
    </div>
  </div>

  <!-- 시간대별 그래프 -->
  <div class="card full">
    <h3>⏰ 시간대별 방문자 그래프</h3>
    <canvas id="hourChart" height="120"></canvas>
  </div>

  <!-- 샤드 상태 -->
  <div class="card full">
    <h3>🧩 샤드 상태</h3>
    <div id="shard-list" class="shard-table"></div>
  </div>

  <!-- Daily 로그 -->
  <div class="card full">
    <h3>📅 Daily 방문자 로그</h3>
    <div class="daily-controls">
      <input type="date" id="daily-date">
      <button id="daily-btn">조회</button>
    </div>
    <pre id="daily-log">날짜를 선택하세요.</pre>
  </div>

  <script src="admin.js"></script>
</body>
</html>
