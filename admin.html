<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 방문자 모니터링</title>

  <link rel="stylesheet" href="admin.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- 🔐 로그인 체크 -->
  <script>
    (async () => {
      const token = localStorage.getItem("admin_token");
      const time = localStorage.getItem("admin_token_time");

      if (!token || !time) {
        window.location.href = "admin-login.html";
        return;
      }

      const now = Date.now();
      const diff = now - Number(time);
      const SESSION_LIMIT = 2 * 60 * 60 * 1000; // 2시간

      if (diff > SESSION_LIMIT) {
        localStorage.removeItem("admin_token");
        localStorage.removeItem("admin_token_time");
        alert("세션이 만료되었습니다. 다시 로그인해주세요.");
        window.location.href = "admin-login.html";
        return;
      }
    })();
  </script>

  <!-- 🔍 관리자 접근 로그 기록 -->
  <script>
    async function logAdminAccess() {
      const ipRes = await fetch("https://api.ipify.org?format=json");
      const ip = (await ipRes.json()).ip;

      const now = new Date();
      const time = now.toISOString().replace("T", " ").slice(0, 19);

      firebase.firestore()
        .collection("admin_logs")
        .doc(String(Date.now()))
        .set({
          ip: ip,
          time: time,
          user: "admin"
        });
    }

    logAdminAccess();
  </script>

</head>
<body>

  <!-- ⭐ 상단 네비게이션 -->
  <div class="admin-header">
    <div class="title">📊 관리자 대시보드</div>

    <div class="actions">
      <button id="change-pw-btn" class="btn-secondary">비밀번호 변경</button>
      <button id="logout-btn" class="btn-danger">로그아웃</button>
    </div>
  </div>

  <!-- ⭐ 대시보드 카드 -->
  <div class="admin-container">

    <div class="card">
      <div class="card-title">오늘 방문자</div>
      <div id="admin-today" class="card-value">0</div>
    </div>

    <div class="card">
      <div class="card-title">전체 방문자</div>
      <div id="admin-total" class="card-value">0</div>
    </div>

    <div class="card full">
      <div class="card-title">⏰ 시간대별 방문자 그래프</div>
      <canvas id="hourChart" height="120"></canvas>
    </div>

    <div class="card full">
      <div class="card-title">🧩 샤드 상태</div>
      <div id="shard-list" class="shard-table"></div>
    </div>

    <div class="card full">
      <div class="card-title">📅 Daily 방문자 로그</div>

      <div class="daily-controls">
        <input type="date" id="daily-date">
        <button id="daily-btn" class="btn-secondary">조회</button>
      </div>

      <pre id="daily-log">날짜를 선택하세요.</pre>
    </div>

  </div>

  <script src="admin.js"></script>
</body>
</html>
