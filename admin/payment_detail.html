<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>결제 상세 정보</title>

  <link rel="stylesheet" href="payment_detail.css">
 
</head>

<body>

<div class="box">
  <h2>💳 결제 상세 정보</h2>

  <div id="paymentInfo" class="section">
    <p>불러오는 중...</p>
  </div>

  <h3>👤 사용자 정보</h3>
  <div id="userInfo" class="section">
    <p>불러오는 중...</p>
  </div>

  <h3>📝 결제 로그</h3>
  <div id="logBox" class="section">
    <p>불러오는 중...</p>
  </div>

<div class="log-input">
  <textarea id="logInput" placeholder="관리자 메모를 입력하세요"></textarea>
  <button id="addLogBtn" class="add-log">로그 추가</button>
</div>

  <div class="btn-group">
    <button id="confirmBtn" class="confirm">입금 확인</button>
    <button id="cancelBtn" class="cancel">결제 취소</button>
    <button id="backBtn" class="back">← 목록으로</button>
  </div>
</div>
 <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- Firebase 초기화 -->
  <script src="/firebase-init.js"></script>
<script src="payment_detail.js"></script>
</body>
</html>
