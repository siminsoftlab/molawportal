<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 결제 관리</title>

  <link rel="stylesheet" href="payments.css">
 
</head>

<body>

<div class="box">
  <h2>💰 결제 관리 대시보드</h2>
  <input 
  type="text" 
  id="searchInput" 
  class="search" 
  placeholder="입금자명 검색 (예: 홍길동)">

  <div id="paymentList" class="payment-list">
    <p>결제내역을 불러오는 중...</p>
  </div>
  <button id="excelBtn" class="excel">📥 엑셀 다운로드</button>
  <button id="backBtn" class="back">← 관리자 홈으로</button>
</div>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <!-- Firebase 초기화 -->
  <script src="/firebase-init.js"></script>
  <script src="payments.js"></script>
  <script>
    (async () => {
      const token = localStorage.getItem("admin_token");
      const time = localStorage.getItem("admin_token_time");

      if (!token || !time) {
        window.location.href = "admin-login.html";
        return;
      }

      const now = Date.now();
      const diff = now - Number(time);
      const SESSION_LIMIT = 2 * 60 * 60 * 1000; // 2시간

      if (diff > SESSION_LIMIT) {
        localStorage.removeItem("admin_token");
        localStorage.removeItem("admin_token_time");
        alert("세션이 만료되었습니다. 다시 로그인해주세요.");
        window.location.href = "admin-login.html";
        return;
      }
    })();
  </script>
</body>
</html>
