<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 결제 관리</title>

  <link rel="stylesheet" href="payments.css">
 
</head>

<body>

<div class="box">
  <h2>💰 결제 관리 대시보드</h2>
  <input 
  type="text" 
  id="searchInput" 
  class="search" 
  placeholder="입금자명 검색 (예: 홍길동)">

  <div id="paymentList" class="payment-list">
    <p>결제내역을 불러오는 중...</p>
  </div>
  <button id="confirmBtn" class="confirm">결제 승인</button>
  <button id="excelBtn" class="excel">📥 엑셀 다운로드</button>
  <button id="backBtn" class="back">← 관리자 홈으로</button>
</div>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <!-- Firebase 초기화 -->
  <script src="/firebase-init.js"></script>
  <script src="payments.js"></script>
</body>
</html>
