<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원 목록 조회</title>
  <link rel="stylesheet" href="admin.css?v=1003">
</head>

<body>

  <div class="admin-header">
    <div class="title">👥 회원 목록</div>
    <div class="actions">
      <button onclick="location.href='admin.html'" class="btn-secondary">대시보드</button>
      <button id="logout-btn" class="btn-danger">로그아웃</button>
    </div>
  </div>

  <div class="admin-container section">
    <div class="card">
      <div class="card-title">회원 검색</div>
      <input id="searchInput" type="text" placeholder="이름 또는 이메일 검색" style="width:100%; padding:12px;">
    </div>
  </div>

  <div class="admin-container section">
    <div class="card">
      <div class="card-title">회원 목록</div>

      <table class="admin-table">
        <thead>
          <tr>
            <th>이름</th>
            <th>이메일</th>
            <th>휴대전화</th>
            <th>가입일</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="/firebase-init.js"></script>
   <!-- Firebase 초기화 -->
  <script src="/firebase-init.js"></script>
  <script src="admin-users.js?v=1001"></script>
</body>
</html>
