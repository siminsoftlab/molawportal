<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>법원 생계비 자동 조정 계산기</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body class="subpage">

<header class="fixed-header">
  <h1>법원 생계비 자동 조정 계산기</h1>
  <a href="../index.html" class="home-btn">홈</a>
</header>

<div class="page-wrap">
  <div class="container">

    <label>월 소득(원)</label>
    <input id="la_income" type="number">

    <label>가구 수</label>
    <select id="la_household">
      <option value="1538523">1인 가구 — 1,538,523원</option>
      <option value="2519575">2인 가구 — 2,519,575원</option>
      <option value="3215422">3인 가구 — 3,215,422원</option>
      <option value="3896843">4인 가구 — 3,896,843원</option>
      <option value="4534031">5인 가구 — 4,534,031원</option>
    </select>

    <label>사용자가 입력한 생계비(원)</label>
    <input id="la_living_user" type="number">

    <label>추가 생계비(원)</label>
    <input id="la_extra" type="number">

    <label>변제기간(개월)</label>
    <input id="la_months" type="number" value="36">

    <div class="btn-row">
      <button onclick="calcLivingAdjust()">계산하기</button>
      <button onclick="resetLivingAdjust()">초기화</button>
    </div>

    <div id="la_summary" class="summary-card"></div>

    <div class="accordion">
      <button id="la_btn" class="accordion-btn" onclick="toggleAccordion('la_accordion','la_btn')">
        계산 상세 보기 ▼
      </button>
      <div id="la_accordion" class="accordion-content"></div>
    </div>

    <div id="la_seo" class="seo-box-animated"></div>

  </div>
</div>

<script src="../living-adjust.js"></script>
</body>
</html>
