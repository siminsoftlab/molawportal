<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>법원 생계비 자동 조정 계산기</title>

  <meta name="description" content="법원 기준에 따라 생계비를 자동 조정하여 변제 가능 금액을 계산하는 도구입니다.">
  <meta property="og:type" content="article">
  <meta property="og:title" content="법원 생계비 자동 조정 계산기">
  <meta property="og:description" content="법원 기준에 따라 생계비를 자동 조정하여 변제 가능 금액을 계산하는 도구입니다.">
  <meta property="og:url" content="https://molawcalculator.com/calculators/living-adjust.html">
  <meta property="og:image" content="https://molawcalculator.com/images/og_main.png">

  <link rel="stylesheet" href="../style.css">
</head>
<body class="subpage">
<header class="fixed-header">
  <h1>법원 생계비 자동 조정 계산기</h1>
  <a href="../index.html" class="home-btn">홈</a>
</header>

<div class="page-wrap">
  <div class="container">

    <label>월 소득(원)</label>
    <input id="la_income" type="number">

    <label>가구 수</label>
    <select id="la_household">
      <option value="1">1인 가구</option>
      <option value="2">2인 가구</option>
      <option value="3">3인 가구</option>
      <option value="4">4인 가구</option>
      <option value="5">5인 가구</option>
    </select>

    <label>사용자가 입력한 생계비(원)</label>
    <input id="la_living_user" type="number">

    <label>추가 생계비(원)</label>
    <input id="la_extra" type="number">

    <label>변제기간(개월)</label>
    <input id="la_months" type="number" value="36">

    <div class="btn-row">
      <button onclick="calcLivingAdjust()">계산하기</button>
      <button onclick="resetLivingAdjust()">초기화</button>
    </div>

    <div id="la_summary" class="summary-card"></div>

    <div class="accordion">
      <button class="accordion-btn" onclick="toggleAccordion('la_accordion','la_btn')"
              id="la_btn">계산 상세 보기 ▼</button>
      <div id="la_accordion" class="accordion-content"></div>
    </div>

    <div id="la_seo" class="seo-box-animated"></div>

  </div>
</div>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-company">딱요만큼변제</div>
    <div class="footer-info">
      상호: 법무법인 영민 | 대표: 박희영 | 사업자등록번호: 425-88-00769  
      주소: 06645 서울특별시 서초구 반포대로30길 70, 5층(서초동, 우성빌딩)  
      개인정보관리책임자: 박희영  
      전화: 02-595-5706  
      팩스: 02-525-7255
    </div>

  </div>
</footer>

<div class="call-fixed">
  <a href="tel:025955706" class="consult-call">
    개인회생·파산 무료상담전화 02-595-5706 ← 클릭 시 전화 연결
  </a>
</div>
<a href="http://pf.kakao.com/_wAqxen/chat" 
   class="quick-kakao" target="_blank" rel="noopener noreferrer">
  💬 카톡 상담
</a>

<script>
function toggleAccordion(contentId, btnId) {
  const box = document.getElementById(contentId);
  const btn = document.getElementById(btnId);
  if (box.style.display === "block") {
    box.style.display = "none";
    btn.textContent = "계산 상세 보기 ▼";
  } else {
    box.style.display = "block";
    btn.textContent = "계산 상세 접기 ▲";
  }
}

function resetLivingAdjust() {
  document.getElementById('la_income').value = "";
  document.getElementById('la_household').value = "1";
  document.getElementById('la_living_user').value = "";
  document.getElementById('la_extra').value = "";
  document.getElementById('la_months').value = "36";
  document.getElementById('la_summary').style.display = "none";
  document.getElementById('la_accordion').style.display = "none";
  document.getElementById('la_seo').classList.remove('visible');
  document.getElementById('la_seo').innerHTML = "";
}

function calcLivingAdjust() {
  const income = Number(document.getElementById('la_income').value || 0);
  const household = Number(document.getElementById('la_household').value || 1);
  const livingUser = Number(document.getElementById('la_living_user').value || 0);
  const extra = Number(document.getElementById('la_extra').value || 0);
  const months = Number(document.getElementById('la_months').value || 0);

  const baseLiving1 = 1538523;
  const weights = {1:1.0, 2:1.5, 3:2.1, 4:2.6, 5:3.1};
  const weight = weights[household] || weights[5];
  const courtLiving = Math.round(baseLiving1 * weight);

  const finalLiving = Math.min(livingUser || courtLiving, courtLiving);
  const totalLiving = finalLiving + extra;
  const disposable = Math.max(income - totalLiving, 0);
  const totalRepay = disposable * months;

  const summary = document.getElementById('la_summary');
  summary.innerHTML = `
    조정 후 총 생계비: ${totalLiving.toLocaleString()}원<br>
    월 변제 가능 금액: ${disposable.toLocaleString()}원<br>
    총 변제금(소득 기준): ${totalRepay.toLocaleString()}원
  `;
  summary.style.display = "block";

  const acc = document.getElementById('la_accordion');
  acc.innerHTML = `
    <div class="calc-step"><strong>1) 월 소득</strong><br>${income.toLocaleString()}원</div>
    <div class="calc-step"><strong>2) 가구 수</strong><br>${household}인</div>
    <div class="calc-step"><strong>3) 법원 기준 생계비</strong><br>${courtLiving.toLocaleString()}원</div>
    <div class="calc-step"><strong>4) 입력 생계비</strong><br>${livingUser.toLocaleString()}원</div>
    <div class="calc-step"><strong>5) 최종 인정 생계비</strong><br>${finalLiving.toLocaleString()}원</div>
    <div class="calc-step"><strong>6) 추가 생계비</strong><br>${extra.toLocaleString()}원</div>
    <div class="calc-step"><strong>7) 총 생계비</strong><br>${totalLiving.toLocaleString()}원</div>
    <div class="calc-step"><strong>8) 월 변제 가능 금액</strong><br>${disposable.toLocaleString()}원</div>
    <div class="calc-step"><strong>9) 총 변제금(소득 기준)</strong><br>${totalRepay.toLocaleString()}원</div>
  `;
  acc.style.display = "block";

  const seo = document.getElementById('la_seo');
  seo.innerHTML = `
    <h3>📌 법원 생계비 자동 조정 설명</h3>
    <p>가구 수 ${household}인 기준으로 법원 생계비는 ${courtLiving.toLocaleString()}원이며, 입력하신 생계비와 비교하여 더 낮은 금액인 ${finalLiving.toLocaleString()}원이 최종 생계비로 인정되었습니다.</p>
    <p>월 소득 ${income.toLocaleString()}원에서 총 생계비 ${totalLiving.toLocaleString()}원을 제외한 월 변제 가능 금액은 ${disposable.toLocaleString()}원이며, 변제기간 ${months}개월 기준 총 변제금은 ${totalRepay.toLocaleString()}원입니다.</p>
  `;
  setTimeout(() => seo.classList.add('visible'), 50);
}
</script>
</body>
</html>
