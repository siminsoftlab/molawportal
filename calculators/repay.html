<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>개인회생 변제금 계산기</title>
  <meta name="description" content="월 소득, 생계비, 변제 기간 등을 입력하면 개인회생 변제금을 자동 계산해주는 계산기입니다.">
  <meta property="og:type" content="article">
  <meta property="og:title" content="개인회생 변제금 계산기">
  <meta property="og:description" content="월 소득, 생계비, 변제 기간 등을 입력하면 개인회생 변제금을 자동 계산해주는 계산기입니다.">
  <meta property="og:url" content="https://molawcalculator.com/calculators/repay.html">
  <meta property="og:image" content="https://molawcalculator.com/images/og_main.png">
  <link rel="stylesheet" href="../style.css">
  <script src="../app.js" defer></script>
</head>
<body>

<header>
  <h1>개인회생 변제금 계산기</h1>
  <a href="../index.html" class="home-btn">홈</a>
</header>

<div class="container">
  <label>월 소득(원)</label>
  <input id="income" type="number" value="0">

  <label>기본 생계비(원)</label>
  <select id="living">
    <option value="1538523">1인 가구 — 1,538,523원</option>
    <option value="2519575">2인 가구 — 2,519,575원</option>
    <option value="3215422">3인 가구 — 3,215,422원</option>
    <option value="3896843">4인 가구 — 3,896,843원</option>
    <option value="4534031">5인 가구 — 4,534,031원</option>
  </select>
 
  <label>추가 생계비(원)</label>
  <input id="extra" type="number" value="0">

  <label>변제기간(개월)</label>
  <input id="months" type="number" value="36">

  <label>청산가치(원, 선택)</label>
  <input id="asset" type="number" value="0">
   <p class="notice">
    ※ 청산가치 = 보유재산 가치
    </p>
  <div class="btn-row">
    <button onclick="calcRepay()">계산하기</button>
    <button onclick="resetInputs()">초기화</button>
  </div>
  <div id="repayResult" class="result-box"></div>

  <p class="notice">
    ※ 본 계산기는 참고용이며 실제 개인회생 변제금은 법원 판단에 따라 달라질 수 있습니다.
  </p>
</div>
<!-- 🔥 하단 고정 상담바 -->
<div class="fixed-consult-bar">
  <a href="tel:025955706" class="consult-call">
    📞 개인회생파산 무료상담전화 02-595-5706  ← 클릭 시 전화 연결
  </a>
</div>
</body>
</html>
