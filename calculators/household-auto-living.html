<head>
  <meta charset="UTF-8">

  <title>가구수 생계비 계산기</title>

<body class="subpage">

<header class="fixed-header">
  <h1>가구수 생계비 계산기</h1>
  <a href="../index.html" class="home-btn">홈</a>
</header>

<div class="page-wrap">
  <div class="container">

    <label>월 소득(원)</label>
    <input id="hl_income" type="number">

    <label>가구 수</label>
    <select id="hl_household">
      <option value="1">1인 가구</option>
      <option value="2">2인 가구</option>
      <option value="3">3인 가구</option>
      <option value="4">4인 가구</option>
      <option value="5">5인 가구</option>
    </select>

    <label>추가 생계비(원)</label>
    <input id="hl_extra" type="number">

    <label>변제기간(개월)</label>
    <input id="hl_months" type="number" value="36">

    <label>청산가치(원, 선택)</label>
    <input id="hl_asset" type="number">

    <div class="btn-row">
      <button onclick="calcHouseholdLiving()">계산하기</button>
      <button onclick="resetHouseholdLiving()">초기화</button>
    </div>

    <div id="hl_summary" class="summary-card"></div>

    <div class="accordion-item">
      <button class="acc-btn calc-acc-btn hl-acc-btn">
        계산 상세 보기 ▼
      </button>
      <div class="acc-content calc-acc-content" id="hl_accordion"></div>
    </div>

    <div id="hl_seo" class="seo-box-animated"></div>

  </div>
</div>
